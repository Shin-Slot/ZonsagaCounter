<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斜めSAGAカウンター</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>斜めSAGAカウンター</h1>
        <div class="header-controls">
            <button id="exportButton" class="header-button export-button">CSV出力</button>
            <button id="importButton" class="header-button import-button">CSV読込</button>
            <button id="resetButton" class="header-button reset-button">リセット</button>
            <input type="file" id="csvFileInput" accept=".csv" style="display: none;">
        </div>
    </header>

    <main class="container">
        <div id="pendingStatus" class="status-message">転落Gの入力を待機中...</div>
        
        <div class="input-section">
            <div class="input-group">
                <label for="gInput">G数</label>
                <input type="number" id="gInput" placeholder="現在のG数を入力" inputmode="numeric" pattern="[0-9]*">
            </div>
            
            <div class="button-grid">
                <button id="fallButton" class="action-btn-large fall-btn">転落G記録</button>
                <button id="diagonalButton" class="action-btn-large diagonal-btn" disabled>斜めG記録</button>
                <button id="stButton" class="action-btn-large st-btn">ST当選</button>
            </div>
        </div>
    </main>

    <section class="results">
        <div class="stats-card">
            <h2>斜めSAGA揃い確率</h2>
            <p id="averageDisplay">データなし</p>
        </div>

        <div class="table-container">
            <h2>保存リスト</h2>
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>転落</th>
                        <th>斜め</th>
                        <th>母数</th>
                        <th>確率</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                    <!-- データはここにJavaScriptで挿入されます -->
                </tbody>
            </table>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
