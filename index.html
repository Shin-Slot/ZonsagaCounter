<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斜めSAGAカウンター</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>斜めSAGAカウンター</h1>
        <div class="header-controls">
            <button id="exportButton" class="header-button export-button">CSV出力</button>
            <button id="importButton" class="header-button import-button">CSV読込</button>
            <button id="resetButton" class="header-button reset-button">リセット</button>
            <input type="file" id="csvFileInput" accept=".csv" style="display: none;">
        </div>
    </header>

    <main class="container">
        <div id="pendingStatus" class="status-message">転落Gの入力を待機中...</div>

        <div class="input-section">
            <div class="input-group">
                <input type="number" id="gInput" placeholder="G数入力" inputmode="numeric" pattern="[0-9]*">
                <div class="input-actions">
                    <button id="fallButton" class="action-btn-main fall-btn">転落G</button>
                    <button id="diagonalButton" class="action-btn-main diagonal-btn" disabled>斜めG</button>
                </div>
            </div>
        </div>

        <section class="results-compact">
            <div class="stats-row">
                <span class="stats-label">平均:</span>
                <span id="averageDisplay">データなし</span>
                <button id="stButton" class="st-btn-small">ST当選</button>
            </div>
        </section>

        <section class="table-section">
            <div class="table-container">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>転落</th>
                            <th>斜め</th>
                            <th>母数</th>
                            <th>確率</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody">
                        <!-- データはここにJavaScriptで挿入されます -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
